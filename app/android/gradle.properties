org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ── SAFE//SPIT build fix (2026-09-03) ──────────────────────────────────────────
# Windows cross-drive Kotlin incremental compilation failure:
#   Project is on E:\ but Pub cache plugin sources are on C:\.
#   Kotlin's incremental compiler cannot compute relative paths across drive roots,
#   producing: "this and base files have different roots".
#   Fix: disable Kotlin incremental compilation at project level.
#   This is a reproducible project-level fix (not machine-specific).
#   Build-time cost: ~10-15% slower cold Kotlin compile. No effect on app behavior.
# Reference: https://youtrack.jetbrains.com/issue/KT-36439
kotlin.incremental=false

# Route Kotlin daemon JVM temp to the project drive to further avoid cross-drive issues.
kotlin.daemon.jvm.options=-Djava.io.tmpdir=E:/SafeSpit/app/build/tmp
